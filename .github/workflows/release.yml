# Builds the Velopack installer and publishes a GitHub Release for every v* tag.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Version from tag
        id: version
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: echo "value=$($env:TAG.TrimStart('v'))" >> $env:GITHUB_OUTPUT

      - name: Publish self-contained
        run: dotnet publish src/GhstRDP/GhstRDP.csproj -c Release -r win-x64 --self-contained true -p:Version=${{ steps.version.outputs.value }} -o publish

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      - name: Download previous release for delta updates
        continue-on-error: true
        run: vpk download github --repoUrl ${{ github.server_url }}/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }} -o releases

      - name: Pack installer
        run: >
          vpk pack -u GhstRDPApp -v ${{ steps.version.outputs.value }} -p publish -e GhstRDP.exe
          --packTitle "Ghst RDP" --packAuthors "Ghst" -i src/GhstRDP/Assets/ghst.ico -o releases

      - name: Upload release
        run: >
          vpk upload github --repoUrl ${{ github.server_url }}/${{ github.repository }}
          --publish --releaseName "Ghst RDP ${{ steps.version.outputs.value }}" --tag ${{ github.ref_name }}
          --token ${{ secrets.GITHUB_TOKEN }} -o releases
